name: World State Alpha CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm test
      - run: npm run validate
      - run: npm run measure:prompts
      - name: Package release candidate
        run: |
          npm run package
          VERSION=$(node -p "require('./package.json').version")
          sha256sum "dist/world_state_alpha-$VERSION.zip" dist/release-manifest.json > /tmp/world-state-package.sha256
      - name: Verify package reproducibility
        run: |
          npm run package
          sha256sum --check /tmp/world-state-package.sha256
      - run: git diff --check
